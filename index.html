e":"say","speakerId":null,"text":"A te che, con la tua aria misteriosa, mi hai fatto appassionare già dalle prime volte che ti ho vista. Eri come uno spirito etereo per me. La tua bellezza ti faceva sembrare di un altro mondo: intangibile, impossibile, affascinante, fresca e soffice come la neve.","expression":null,"stageDiff":null,"transition":null,"audioCues":[],"displayName":null,"style":"normal","extend":false,"condition":null,"nextId":"say_mubdvqmc2o6l2v"},{"id":"say_mubdvqmc2o6l2v","type":"say","speakerId":null,"text":"Mi hai donato quello stesso sentimento di pace e tranquillità che si prova quando la neve scende dal cielo e sembra rendere tutto più silenzioso. Guardare nei tuoi occhi è stato come fare un viaggio in Antartide, per poi tuffarsi in un mare ghiacciato, elementi magnifici che appartengono a una creatura tanto meravigliosa quanto schiva.","expression":null,"stageDiff":null,"transition":null,"audioCues":[],"displayName":null,"style":"normal","extend":false,"condition":null,"nextId":"say_mubdvqmd2pa88h"},{"id":"say_mubdvqmd2pa88h","type":"say","speakerId":null,"text":"Anche per questo è stato difficile per me realizzare che potesse esserci davvero una possibilità di contatto tra queste due realtà. Era come unire il fisico al metafisico, qualcosa che sembrava impossibile da raggiungere e invece è successo e mi sembra ancora di vivere un sogno.","expression":null,"stageDiff":null,"transition":null,"audioCues":[],"displayName":null,"style":"normal","extend":false,"condition":null,"nextId":"say_mubdvqmd2q9b3j"},{"id":"say_mubdvqmd2q9b3j","type":"say","speakerId":null,"text":"Grazie per avermi sopportato in questi mesi, per avermi conosciuto anche nei miei momenti peggiori e per aver continuato a guardarmi con gli stessi occhi. Grazie per aver mantenuto quell'entusiasmo che ti caratterizza, nelle cose belle così come in quelle brutte. Grazie per tutte le volte in cui mi hai fatto sorridere, per tutte quelle in cui mi hai ascoltato e, soprattutto, grazie #kio-series { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; z-index: 4;
  background: ${e.bg}; color: ${e.ink}; font-family: ${e.font}; -webkit-font-smoothing: antialiased; }
#kio-series[hidden] { display: none; }
#kio-series * { box-sizing: border-box; }
#kio-series .wrap { max-width: 1000px; margin: 0 auto; padding: clamp(24px, 6vh, 64px) clamp(16px, 4vw, 40px) 48px;
  min-height: 100%; display: flex; flex-direction: column; gap: clamp(20px, 4vh, 40px); }
#kio-series h1 { margin: 0; font-size: clamp(28px, 7vw, 58px); line-height: 1.05; letter-spacing: .08em;
  text-transform: ${t}; font-weight: 700; }
#kio-series h2 { margin: 0; font-size: clamp(22px, 5vw, 36px); line-height: 1.1; letter-spacing: .06em; text-transform: ${t}; }
#kio-series .head { text-align: center; }
#kio-series .sub { margin: 10px 0 0; color: ${e.inkDim}; font-size: clamp(12px, 2.4vw, 15px); letter-spacing: .16em; text-transform: ${t}; }
#kio-series .rule { height: 1px; background: ${e.line}; border: 0; margin: 0; }

#kio-series .grid { display: flex; flex-direction: column; gap: 14px; }
#kio-series .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
#kio-series .row > * { flex: 1 1 190px; max-width: 320px; }

#kio-series button { font: inherit; color: inherit; cursor: pointer; background: ${e.panel};
  border: 1px solid ${e.line}; border-radius: 2px; text-align: left; }
#kio-series button:focus-visible { outline: 2px solid ${e.accent}; outline-offset: 2px; }

#kio-series .entry { display: flex; flex-direction: column; gap: 6px; padding: 16px 16px 14px; min-height: 118px;
  transition: border-color .15s, transform .15s, background .15s; }
#kio-series .entry .n { font-size: 11px; letter-spacing: .2em; color: ${e.inkDim}; }
#kio-series .entry .t { font-size: clamp(15px, 2.6vw, 19px); letter-spacing: .06em; text-transform: ${t}; line-height: 1.15; }
#kio-series .entry .s { font-size: 12px; letter-spacing: .1em; color: ${e.inkDim}; }
#kio-series .entry .st { margin-top: auto; font-size: 11px; letter-spacing: .1em; color: ${e.inkDim}; }
#kio-series .entry.open:hover, #kio-series .entry.open:focus-visible { border-color: ${e.accent}; transform: translateY(-2px); }
#kio-series .entry.open .n { color: ${e.accent}; }
#kio-series .entry.done .st { color: ${e.accent}; }
#kio-series .entry.locked { color: ${e.locked}; cursor: not-allowed; background: transparent; border-style: dashed; }
#kio-series .entry.locked .n, #kio-series .entry.locked .s, #kio-series .entry.locked .st { color: ${e.locked}; }

#kio-series .foot { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: auto; }
#kio-series .foot .progress { font-size: 11px; letter-spacing: .18em; color: ${e.inkDim}; text-transform: ${t}; }
#kio-series .flat { background: transparent; padding: 11px 26px; letter-spacing: .18em; font-size: 12px;
  text-transform: ${t}; text-align: center; transition: border-color .15s, color .15s; }
#kio-series .flat:hover, #kio-series .flat:focus-visible { border-color: ${e.accent}; color: ${e.accent}; }
#kio-series .primary { background: ${e.accent}; border-color: ${e.accent}; color: ${e.bg}; font-weight: 700;
  padding: 15px 44px; letter-spacing: .22em; font-size: 14px; text-transform: ${t}; text-align: center; }
#kio-series .primary:hover, #kio-series .primary:focus-visible { filter: brightness(1.12); }

#kio-series .page { display: flex; flex-direction: column; gap: 18px; max-width: 660px; width: 100%; margin: 0 auto; }
#kio-series .page .body { color: ${e.ink}; font-size: clamp(14px, 2.5vw, 16px); line-height: 1.62; }
#kio-series .page .body p { margin: 0 0 1em; }
#kio-series .page .body p:last-child { margin-bottom: 0; }
#kio-series .page .note { color: ${e.inkDim}; font-size: 12px; line-height: 1.6; letter-spacing: .04em; }
#kio-series .page .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
#kio-series .back { align-self: flex-start; padding: 8px 16px; font-size: 11px; letter-spacing: .18em;
  background: transparent; text-transform: ${t}; }
#kio-series .back:hover, #kio-series .back:focus-visible { border-color: ${e.accent}; color: ${e.accent}; }

#kio-series-exit { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); z-index: 6;
  margin: 8px; padding: 7px 13px; font: 11px/1 ${e.font}; letter-spacing: .16em; text-transform: ${t};
  color: ${e.ink}; background: rgba(0,0,0,.55); border: 1px solid ${e.line}; border-radius: 2px; cursor: pointer;
  opacity: .28; transition: opacity .18s; }
#kio-series-exit:hover, #kio-series-exit:focus-visible { opacity: 1; border-color: ${e.accent}; }
#kio-series-exit[hidden] { display: none; }

/* the page shell's "turn your phone" hint belongs to the games, not to the
   menu \u2014 the menu reads fine in portrait, and the overlay would bury it */
body.kio-series-menu #kio-rotate { display: none !important; }

@media (prefers-reduced-motion: reduce) {
